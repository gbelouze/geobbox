[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "geobbox"
readme = "README.md"
description = "A Python library to manipulate georeferenced bounding boxes."
authors = [{ name = "Gabriel Belouze", email = "gabriel@belouze.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"
license = { "file" = "LICENSE" }
dynamic = ["version"]
dependencies = [
    "earthengine-api",
    "numpy",
    "rasterio",
    "shapely>=2.0.6",
    "typing-extensions",
    "utm",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pydoclint[flake8]>=0.8.3",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "ty>=0.0.17",
]
doc = [
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-napoleon>=0.7",
]

[tool.flit.module]
name = "geobbox"

[project.urls]
source = "https://github.com/gbelouze/geobbox"
tracker = "https://github.com/gbelouze/geobbox/issues"

[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pydocstyle and pydoclint
    # "D",
    "DOC",
    # flake8-use-pathlib
    "PTH",
    # flake8-logging
    "LOG",
    # flake8-no-pep420
    "INP",
    "PIE",
    "T20",
    # pytest
    "PT",
]
ignore = ["DOC501", "DOC201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["INP001"]
"docs/**/*.py" = ["INP001"]

[tool.pydoclint]
style = "numpy"
skip-checking-raises = true

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = true
log_cli_level = "DEBUG"
log_level = "DEBUG"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

